name: TEMP Prepare UniFi2MQTT 2.0.49 management IP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'review/unifi-ip-snapshot-2.0.49'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check paho-mqtt

      - name: Prepare and validate UniFi2MQTT 2.0.49
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/prepare_unifi_2049_temp.py ]; then
            echo 'Review branch is already prepared.'
            exit 0
          fi
          python3 tools/prepare_unifi_2049_temp.py

      - name: Commit finished review build
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/prepare_unifi_2049_temp.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          if git diff --cached --quiet; then
            echo 'No preparation changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          git commit -m 'UniFi2MQTT 2.0.49: preserve management IP'
          git push origin HEAD:${{ github.head_ref }}
