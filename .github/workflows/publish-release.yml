name: Publish UniFi2MQTT Release

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - .sv-release-request.json

concurrency:
  group: unifi2mqtt-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: UniFi2MQTT release preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      target_sha: ${{ steps.request.outputs.target_sha }}
    steps:
      - name: Checkout release request only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require transport-only one-file PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only | sort -u)
          printf 'changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".sv-release-request.json"

      - name: Validate release request
        id: request
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          path = Path('.sv-release-request.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if set(data) != {'version', 'target_sha', 'publish'}:
              raise SystemExit('release request must contain exactly version,target_sha,publish')
          version = data['version']
          target = data['target_sha']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('version must be strict semver x.y.z')
          if not isinstance(target, str) or not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('target_sha must be a lowercase 40-character SHA')
          if data['publish'] is not True:
              raise SystemExit('publish must be true')
          print(f'version={version}')
          print(f'target_sha={target}')
          PY

      - name: Require exact current main target
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          VERSION: ${{ steps.request.outputs.version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_SHA" = "$BASE_SHA"
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$TARGET_SHA" = "$current_main"
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: $VERSION" >&2
            exit 1
          fi

      - name: Checkout exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify target version metadata
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          test "$(cat target/VERSION)" = "$VERSION"
          grep -Eq "^version:[[:space:]]*['\"]?$VERSION['\"]?[[:space:]]*$" target/switch-vision-unifi2mqtt/config.yaml
          grep -q "^## v$VERSION$" target/CHANGELOG.md
          cmp -s target/CHANGELOG.md target/switch-vision-unifi2mqtt/CHANGELOG.md

  validate:
    name: Validate exact UniFi2MQTT release target
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check paho-mqtt
      - name: Run complete regression suite
        run: |
          set -euo pipefail
          python -m py_compile switch-vision-unifi2mqtt/*.py
          bash -n switch-vision-unifi2mqtt/run.sh
          python switch-vision-unifi2mqtt/self-test.py
          python switch-vision-unifi2mqtt/hardening-test.py
          python switch-vision-unifi2mqtt/mqtt-lifecycle-test.py
          python switch-vision-unifi2mqtt/classic-port-probe-test.py
          python switch-vision-unifi2mqtt/multi-controller-test.py
          python switch-vision-unifi2mqtt/multi-controller-probe-test.py

  build:
    name: Validate release container / ${{ matrix.arch }}
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build exact release target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./switch-vision-unifi2mqtt
          push: false
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.preflight.outputs.target_sha }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: ghcr.io/zemerdon/switch-vision-unifi2mqtt:release-check-${{ matrix.arch }}

  publish:
    name: Publish GitHub release
    needs: [preflight, validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Extract release notes from changelog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          header = f'## v{version}'
          try:
              start = lines.index(header)
          except ValueError as exc:
              raise SystemExit(f'missing changelog section {header}') from exc
          end = len(lines)
          for idx in range(start + 1, len(lines)):
              if lines[idx].startswith('## v'):
                  end = idx
                  break
          body = '\n'.join(lines[start + 1:end]).strip()
          if not body:
              raise SystemExit('release changelog section is empty')
          Path('/tmp/release-notes.md').write_text(body + '\n', encoding='utf-8')
          PY

      - name: Create exact-target GitHub release
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Switch Vision UniFi2MQTT v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Verify public tag and release target
        run: |
          set -euo pipefail
          tag_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$VERSION" | awk '{print $1}')"
          test -n "$tag_sha"
          test "$tag_sha" = "$TARGET_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          if data.get('draft') is not False or data.get('prerelease') is not False:
              raise SystemExit('release must be public, non-draft and non-prerelease')
          if data.get('tag_name') != os.environ['VERSION']:
              raise SystemExit('release tag mismatch')
          if data.get('target_commitish') != os.environ['TARGET_SHA']:
              raise SystemExit('release target mismatch')
          print('UniFi2MQTT public GitHub release verification: PASS')
          PY
          echo "version=$VERSION"
          echo "target=$TARGET_SHA"
