name: SV inbox audit preparer
on:
  push:
    branches:
      - review/inbox-audit-unifi2mqtt-2.0.48
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[sv-inbox-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/inbox-audit-unifi2mqtt-2.0.48
      - name: Apply UniFi2MQTT 2.0.48 inbox fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('switch-vision-unifi2mqtt/unifi2mqtt.py')
          text = app.read_text()
          text = text.replace('VERSION = "2.0.47"', 'VERSION = "2.0.48"')
          old = '''KNOWN_GATEWAY_SWITCH_MODELS = {
              "UDM PRO",
              "UDM SE",
              "UDM PRO SE",
          }'''
          new = '''KNOWN_GATEWAY_SWITCH_MODELS = {
              "UDM PRO",
              "UDM SE",
              "UDM PRO SE",
              "UCG ULTRA",
              "UCG FIBER",
          }'''
          if old not in text:
              raise SystemExit('gateway model block not found')
          text = text.replace(old, new, 1)
          text = text.replace('''        if "switching" in names:
              return True, "switching_feature"
          return False, "no_switching_feature"''', '''        if "switching" in names:
              return False, "switching_feature_untrusted"
          return False, "no_switching_feature"''', 1)
          text = text.replace('''        if (
              switching is not None
              and switching is not False
          ):
              return True, "switching_feature"

          return False, "switching_feature_disabled"''', '''        if (
              switching is not None
              and switching is not False
          ):
              return False, "switching_feature_untrusted"

          return False, "switching_feature_disabled"''', 1)
          app.write_text(text)

          test = Path('switch-vision-unifi2mqtt/self-test.py')
          text = test.read_text()
          old = '''    assert m.is_switch({"features": ["switching"], "model": "anything"})
              assert m.is_switch({"features": {"switching": {}}, "model": "anything"})
              assert m.is_switch({"features": [], "model": "USW Pro 24 PoE"})
              assert not m.is_switch({"features": ["accessPoint"], "model": "U6 Pro"})'''
          new = '''    # A UniFi API switching feature is not sufficient identity by itself.
              # Jason's SV-2026-000009 captured AirWire with that feature even though
              # AirWire is a single-port Wi-Fi client/adapter, not a switch.
              assert not m.is_switch({"features": ["switching"], "model": "AirWire"})
              assert not m.is_switch({"features": {"switching": {}}, "model": "AirWire"})
              assert not m.is_switch({"features": ["switching"], "model": "anything"})
              assert m.is_switch({"features": [], "model": "USW Pro 24 PoE"})
              assert m.is_switch({"features": [], "model": "UCG Ultra"})
              assert m.is_switch({"features": [], "model": "UCG Fiber"})
              assert not m.is_switch({"features": ["accessPoint"], "model": "U6 Pro"})'''
          if old not in text:
              raise SystemExit('self-test classifier block not found')
          test.write_text(text.replace(old, new, 1))

          Path('VERSION').write_text('2.0.48\n')
          cfg = Path('switch-vision-unifi2mqtt/config.yaml')
          cfg.write_text(cfg.read_text().replace('version: "2.0.47"', 'version: "2.0.48"', 1))

          entry = '''## 2.0.48 — UniFi device-classification hardening\n\n- Rejects devices that only advertise the UniFi API `switching` feature without belonging to a recognised switch or gateway/switch-hybrid model family.\n- Prevents Ubiquiti AirWire from being misclassified as a Switch Vision switch (SV-2026-000009).\n- Explicitly preserves UCG Ultra and UCG Fiber as gateway/switch hybrids while retaining existing UDM Pro-family handling.\n- Adds permanent regressions for AirWire rejection and UCG Ultra/UCG Fiber acceptance.\n\n'''
          for name in ('CHANGELOG.md', 'switch-vision-unifi2mqtt/CHANGELOG.md'):
              p = Path(name)
              s = p.read_text()
              marker = '# Changelog\n\n'
              if marker not in s:
                  raise SystemExit(f'changelog marker missing: {name}')
              p.write_text(s.replace(marker, marker + entry, 1))

          wf = Path('.github/workflows/sv-inbox-audit-prep.yml')
          if wf.exists():
              wf.unlink()
          PY
          python switch-vision-unifi2mqtt/self-test.py
          git config user.name 'Switch Vision Review Builder'
          git config user.email 'switch-vision@users.noreply.github.com'
          git add -A
          git commit -m '[sv-inbox-prepared] UniFi2MQTT 2.0.48: harden device classification'
          git push origin HEAD:review/inbox-audit-unifi2mqtt-2.0.48
