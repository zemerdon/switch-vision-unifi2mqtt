name: Temporary finish UniFi2MQTT 2.0.48

on:
  push:
    branches:
      - review/inbox-audit-unifi2mqtt-2.0.48

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/inbox-audit-unifi2mqtt-2.0.48
          fetch-depth: 0
      - name: Apply audited 2.0.48 final changes
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('switch-vision-unifi2mqtt/unifi2mqtt.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''KNOWN_GATEWAY_SWITCH_MODELS = {\n    "UDM PRO",\n    "UDM SE",'''
          new = '''KNOWN_GATEWAY_SWITCH_MODELS = {\n    "UDM PRO",\n    "UDM PRO MAX",\n    "UDM SE",'''
          if old not in text:
              raise SystemExit('gateway hybrid allow-list anchor not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          self_test = Path('switch-vision-unifi2mqtt/self-test.py')
          text = self_test.read_text(encoding='utf-8')
          old = '''    assert m.is_switch({"features": [], "model": "UCG Fiber"})\n    assert not m.is_switch({"features": ["accessPoint"], "model": "U6 Pro"})'''
          new = '''    assert m.is_switch({"features": [], "model": "UCG Fiber"})\n    # SV-2026-000011: UDM Pro Max is a legitimate gateway/switch hybrid.\n    assert m.is_switch({"features": ["switching"], "model": "UDM Pro Max"})\n    assert m.switch_classification({"features": ["switching"], "model": "UDM Pro Max"}) == (\n        True, "known_gateway_switch_hybrid"\n    )\n    assert not m.is_switch({"features": ["accessPoint"], "model": "U6 Pro"})'''
          if old not in text:
              raise SystemExit('self-test classifier anchor not found')
          self_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          hardening = Path('switch-vision-unifi2mqtt/hardening-test.py')
          text = hardening.read_text(encoding='utf-8')
          old = '''    assert m.VERSION == "2.0.48"\n    assert m.EMPTY_SWITCH_CONFIRM_POLLS == 3'''
          new = '''    assert m.VERSION == "2.0.48"\n    assert m.EMPTY_SWITCH_CONFIRM_POLLS == 3\n    assert not m.is_switch({"features": ["switching"], "model": "AirWire"})\n    assert m.is_switch({"features": ["switching"], "model": "UDM Pro Max"})'''
          if old not in text:
              raise SystemExit('hardening classifier anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('Switch Vision UniFi2MQTT v2.0.46 hardening regression: PASS',
                              'Switch Vision UniFi2MQTT v2.0.48 hardening regression: PASS')
          hardening.write_text(text, encoding='utf-8')

          for name in ('CHANGELOG.md', 'switch-vision-unifi2mqtt/CHANGELOG.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '- Explicitly preserves UCG Ultra and UCG Fiber as gateway/switch hybrids while retaining existing UDM Pro-family handling.',
                  '- Explicitly preserves UCG Ultra, UCG Fiber, and UDM Pro Max as gateway/switch hybrids while retaining existing UDM Pro-family handling.'
              )
              text = text.replace(
                  '- Adds permanent regressions for AirWire rejection and UCG Ultra/UCG Fiber acceptance.',
                  '- Adds permanent regressions for AirWire rejection and UCG Ultra/UCG Fiber/UDM Pro Max acceptance.'
              )
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/temp-finish-2048.yml')
          workflow.unlink()
      - name: Commit final audited changes and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "UniFi2MQTT 2.0.48: preserve UDM Pro Max hybrid classification"
          git push origin HEAD:review/inbox-audit-unifi2mqtt-2.0.48
