name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unifi2mqtt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check paho-mqtt
      - name: Python syntax
        run: python -m py_compile switch-vision-unifi2mqtt/unifi2mqtt.py switch-vision-unifi2mqtt/self-test.py switch-vision-unifi2mqtt/hardening-test.py
      - name: Shell syntax
        run: bash -n switch-vision-unifi2mqtt/run.sh
      - name: Supervisor MQTT wrapper contract
        run: |
          grep -q 'mqtt:need' switch-vision-unifi2mqtt/config.yaml
          grep -q "bashio::services mqtt 'host'" switch-vision-unifi2mqtt/run.sh
          grep -q 'USE_SUPERVISOR_MQTT' switch-vision-unifi2mqtt/run.sh
          grep -q '^exec python3 ' switch-vision-unifi2mqtt/run.sh
      - name: Version and repository metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          version = (root / 'VERSION').read_text().strip()
          cfg = (root / 'switch-vision-unifi2mqtt/config.yaml').read_text()
          run = (root / 'switch-vision-unifi2mqtt/run.sh').read_text()
          py = (root / 'switch-vision-unifi2mqtt/unifi2mqtt.py').read_text()
          assert re.search(r'^version:\s*["\']?' + re.escape(version) + r'["\']?\s*$', cfg, re.M)
          assert f'VERSION="{version}"' in run
          assert f'VERSION = "{version}"' in py
          assert 'https://github.com/zemerdon/switch-vision-unifi2mqtt' in cfg
          print('metadata/version checks: PASS')
          PY
      - name: Home Assistant app changelog
        run: |
          test -f switch-vision-unifi2mqtt/CHANGELOG.md
          cmp -s CHANGELOG.md switch-vision-unifi2mqtt/CHANGELOG.md
          grep -q "^## v$(cat VERSION)$" switch-vision-unifi2mqtt/CHANGELOG.md
      - name: UniFi regression tests
        run: |
          python switch-vision-unifi2mqtt/self-test.py
          python switch-vision-unifi2mqtt/hardening-test.py
