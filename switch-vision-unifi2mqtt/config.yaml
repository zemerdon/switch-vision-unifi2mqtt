name: Switch Vision UniFi2MQTT
version: "3.1.2"
slug: switch_vision_unifi2mqtt
description: Read-only multi-controller UniFi Network bridge to MQTT for Switch Vision, with privacy-safe capability diagnostics.
url: https://github.com/zemerdon/switch-vision-unifi2mqtt
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
map:
  - share:rw
  - ssl:ro
services:
  - mqtt:need
options:
  transport: "local"
  controller_url: "https://192.168.1.1"
  host_id: "auto"
  site_id: "auto"
  verify_ssl: "true"
  allow_insecure_http: "false"
  priority_transport: "local"
  fallback_transport: "remote"
  local_controller_url: "https://192.168.1.1:11443"
  local_site_id: "auto"
  local_verify_ssl: "true"
  local_allow_insecure_http: "false"
  remote_host_id: "auto"
  remote_site_id: "auto"
  controllers: []
  poll_interval: "30"
  mqtt_host: ""
  mqtt_port: "1883"
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: "false"
  mqtt_verify_ssl: "true"
  mqtt_ca: ""
  mqtt_topic_prefix: "switch_vision/unifi"
  mqtt_discovery_prefix: "homeassistant"
schema:
  transport: list(local|remote)
  controller_url: str?
  host_id: str?
  site_id: str?
  api_key: password?
  verify_ssl: list(false|true)
  allow_insecure_http: list(false|true)
  priority_transport: list(local|remote)
  fallback_transport: list(none|local|remote)
  local_controller_url: str?
  local_site_id: str?
  local_api_key: password?
  local_verify_ssl: list(false|true)
  local_allow_insecure_http: list(false|true)
  remote_host_id: str?
  remote_site_id: str?
  remote_api_key: password?
  controllers:
    - id: str
      transport: list(local|remote)?
      controller_url: str?
      host_id: str?
      site_id: str?
      api_key: password
      verify_ssl: list(false|true)?
      allow_insecure_http: list(false|true)?
  poll_interval: int(10,300)
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: list(false|true)
  mqtt_verify_ssl: list(false|true)
  mqtt_ca: str?
  mqtt_topic_prefix: str
  mqtt_discovery_prefix: str
